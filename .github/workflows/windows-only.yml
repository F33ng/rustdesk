name: Windows Build Only

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VCPKG_COMMIT_ID: "7147ac1294ef9647e8679e1183ac440a5d0a63b7"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd "${{ github.workspace }}/vcpkg"
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Install vcpkg deps
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear"
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}/vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          $env:VCPKG_DEFAULT_HOST_TRIPLET = "x64-windows-static"
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet x64-windows-static `
            --host-triplet x64-windows-static `
            --no-binarycaching
 
      - name: Flutter pub get
        working-directory: ./flutter
        run: flutter pub get

      - name: Build Rust
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cargo build --release --features flutter

      - name: Build Flutter Windows
        working-directory: ./flutter
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rustdesk-windows
          Copy-Item target\release\rustdesk.exe rustdesk-windows\
          Copy-Item -Recurse flutter\build\windows\x64\runner\Release\* rustdesk-windows\

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64
          path: rustdesk-windows/
          retention-days: 14
